name: Release

# Tag a commit `v1.0.1` and push it; this builds the installers, signs the update
# artifact, writes `latest.json`, and publishes a draft release. Review the draft
# and publish it; installed copies start seeing the update the moment you do.
#
# Requires one repository secret, `TAURI_SIGNING_PRIVATE_KEY`: the contents of
# the minisign private key whose public half is in `src-tauri/tauri.conf.json`.
# Add `TAURI_SIGNING_PRIVATE_KEY_PASSWORD` too if that key has a password.
# See docs/RELEASING.md.

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    # Windows-only by design: the whole hardware layer is Win32 (see README).
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # The suites the README asks contributors to run, so a tag can't ship
      # something that was never green.
      - run: npx tsc --noEmit
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      # One checked-in note source feeds both the GitHub release and
      # `latest.json`, so the in-app prompt can never ship the old placeholder
      # while the release page says something else.
      - name: Load release notes
        id: release_notes
        shell: pwsh
        run: |
          $notesPath = "docs/releases/$env:GITHUB_REF_NAME.md"
          if (-not (Test-Path -LiteralPath $notesPath)) {
            throw "Missing release notes: $notesPath"
          }
          $delimiter = "RELEASE_NOTES_$([Guid]::NewGuid().ToString('N'))"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "body<<$delimiter"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value (Get-Content -LiteralPath $notesPath -Raw)
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value $delimiter

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # Keep this even when the key has no password. An unset variable makes
          # the signer prompt on stdin, which a CI runner never answers; a
          # missing secret expands to the empty string, which it accepts.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Clawmation ${{ github.ref_name }}
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: true
          # Writes latest.json alongside the installers: the manifest the
          # updater endpoint in tauri.conf.json points at.
          uploadUpdaterJson: true
