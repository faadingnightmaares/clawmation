[package]
name = "clawmation"
# The single source of truth for the app's version: `commands/misc.rs` reads it
# through `CARGO_PKG_VERSION`, `tauri.conf.json` repeats it for the bundler, and
# the updater compares the manifest's version against it. Bump all three together.
version = "1.2.3"
description = "Windows macro recorder with visual workflows, screen detection, OCR, and local automation"
authors = ["faadingnightmaares"]
license-file = "../LICENSE"
readme = "../README.md"
repository = "https://github.com/faadingnightmaares/clawmation"
homepage = "https://github.com/faadingnightmaares/clawmation"
keywords = ["macro", "automation", "windows", "tauri", "screen-capture"]
categories = ["gui"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "clawmation_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` powers the system-tray port (`shell/tray.rs`); the rest of the tray
# stack (menu, notifications) is plugin-provided below.
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
# Native save/open/folder dialogs for the import/export/bundle commands. Called
# from the Rust side (`DialogExt::…::blocking_*`) so the command surface stays a
# 1:1 match for the Python `tkinter.filedialog` flows; the frontend just invokes
# `export_macro` / `import_chain` / … and gets `{ok, path}` back.
tauri-plugin-dialog = "2"
# Versioned `.clawmation` / `.clawbundle` archives. Only the two codecs our
# formats need are compiled in: DEFLATE reads legacy bundles; Zstandard powers
# the new compact payloads without pulling AES/BZip2/LZMA/Zopfli into the app.
zip = { version = "2", default-features = false, features = ["deflate", "zstd"] }
# Fast content checksums make imports corruption-proof and deduplicate identical
# vision assets inside bundles without decoding or recompressing them.
blake3 = "1"
# Encodes the Test-button previews and saved template files
# (`hardware/preview.rs`); already in the tree via tauri, so this is free.
png = "0.17"
# Base64 for those previews' data URIs.
base64 = "0.22"
# Decodes template files in `hardware/vision`. Pure Rust and no system library,
# which is the whole point: the alternative was the `opencv` crate, and that puts
# an OpenCV/vcpkg install between a contributor and their first build. Only the
# formats the template picker accepts are enabled.
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "bmp",
    "webp",
] }
# Row-parallel correlation in `hardware/vision/corr.rs`. A full-screen scale
# sweep is the one genuinely compute-bound thing the app does, and it is
# embarrassingly parallel over output rows.
rayon = "1"
# Optional compute acceleration for large template-correlation sweeps. Vulkan
# is preferred with DX12 fallback across NVIDIA, AMD, and Intel; the existing
# Rayon matcher remains the permanent runtime fallback.
wgpu = { version = "27", default-features = false, features = ["std", "dx12", "vulkan", "wgsl"] }
pollster = "1"
bytemuck = "1"
serde = { version = "1", features = ["derive"] }
# `float_roundtrip` makes float parsing correctly-rounded, so every timestamp and
# duration loads to the exact same f64 the Python app wrote; re-saved macros stay
# byte-identical instead of drifting by 1 ULP.
serde_json = { version = "1", features = ["float_roundtrip"] }
serde_yaml = "0.9"
chrono = "0.4"
# Global hotkeys: record/play/stop fire even when the window is unfocused, the
# port of `Api._register_hotkeys`. See `shell/hotkeys.rs` for the one behavioral
# departure (Tauri's shortcuts are exclusive; Python's `keyboard` hooks weren't).
tauri-plugin-global-shortcut = "2.3.2"
# Tray toasts for playback-complete and scheduled runs, throttled by `notify.rs`,
# the port of `SystemTray.notify`.
tauri-plugin-notification = "2.3.3"
# One running Clawmation at a time: a second launch focuses the first and exits,
# replacing the named-mutex guard in `_acquire_single_instance`. Registered first
# so it wins before any window or hotkey exists.
tauri-plugin-single-instance = "2.4.3"
# Persists window size/position/maximized across sessions, the drop-in for
# Python's `_load_window_state` / `_save_window_state`.
tauri-plugin-window-state = "2.4.1"
# Signed in-app updates (`commands/misc.rs`). Driven entirely from Rust, so the
# frontend keeps invoking plain commands and the JS bindings/capability
# permissions the plugin ships are not needed. See docs/RELEASING.md.
tauri-plugin-updater = "2"

# Raw Win32 bindings for input synthesis. `windows-sys` exposes the API as plain
# integer-alias types and C structs (not the `windows` crate's newtype wrappers),
# which mirror the Python `ctypes` definitions in `input.py` almost line-for-line,
# the faithful, minimal-dependency choice for the input/recorder/player slices.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    # `Win32_UI_HiDpi` gates the `DPI_AWARENESS_CONTEXT_*` constants that
    # `input.rs` uses to make the absolute cursor move Per-Monitor-V2 aware, so
    # the recorded physical pixels aren't stretched by the DPI factor on playback.
    "Win32_UI_HiDpi",
    "Win32_Media",
    # `Win32_Security` gates the SID accessors `window.rs` uses to read a
    # window's mandatory-integrity level, so a Watch click aimed at a
    # higher-privilege window — where Windows silently drops injected input —
    # fails with a clear "run as administrator" error instead of hovering.
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

# The `windows` crate (COM method wrappers, same Microsoft family) is used *only*
# by `hardware/capture.rs`: DXGI Desktop Duplication is ~8 chained COM interfaces
# and hand-indexing their vtables through `windows-sys` is impractical. This buys
# exact control of the capture semantics the Python `dxcam` path must preserve
# (reuse-last-frame on timeout, fps-as-read-throughput, dxcam→mss fallback), the
# reason to hand-roll rather than adopt a capture crate whose own backend model
# we'd have to re-wrap. See MIGRATION-NOTES "Capture".
windows = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    # `hardware/ocr.rs`: the platform OCR engine, replacing the sidecar's
    # EasyOCR path. `Media_Ocr` is the recognizer; `Graphics_Imaging` builds the
    # `SoftwareBitmap` it reads; `Security_Cryptography` wraps our BGRA bytes as
    # the `IBuffer` that bitmap is copied from; `Foundation` supplies the
    # `IAsyncOperation` blocking `.get()`. `Storage_Streams` gates `IBuffer`
    # itself, and `Foundation_Collections` gates the `IVectorView` of OCR lines.
    "Foundation",
    "Foundation_Collections",
    "Graphics_Imaging",
    "Media_Ocr",
    "Security_Cryptography",
    "Storage_Streams",
    # `hardware/overlay.rs`: the fullscreen GDI overlay the screen pickers draw
    # on. `LibraryLoader` supplies the `HINSTANCE` the window class registers
    # against; `Input_KeyboardAndMouse` supplies `GetKeyState`, which is how the
    # Shift modifier is read (`WM_KEYDOWN` carries the key, never the modifiers).
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
] }
