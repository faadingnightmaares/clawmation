[project]
name = "clawmation-vision"
version = "0.1.0"
description = "Clawmation vision sidecar — cv2/easyocr detection compute, driven over stdio JSON-RPC by the Rust/Tauri backend."
readme = "README.md"
requires-python = ">=3.10"

# Core: template + color detection and the mss GDI capture fallback. Pinned to
# the exact versions the original app's detection was validated on — the vision
# fidelity guarantee rests on identical cv2/numpy behaviour, so these are ==, not
# floors. dxcam and easyocr are optional (both are imported lazily with a
# graceful fallback), so a core install covers template + color guards.
dependencies = [
    "opencv-python==5.0.0.93",
    "numpy==2.5.1",
    "mss==10.2.0",
]

[project.optional-dependencies]
# DXGI Desktop Duplication — the fast primary capture backend on Windows. When
# absent, ScreenCapture falls back to mss automatically.
capture = ["dxcam>=0.0.5"]
# OCR guard method (method="ocr"). Heavy — pulls in torch. Only needed for OCR
# guards; easyocr is imported lazily on first OCR call.
ocr = ["easyocr>=1.7.0"]

[project.scripts]
clawmation-vision = "clawmation_vision.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clawmation_vision"]
