<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Clawmation Indicator</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
      }
      /* The 96×88 sprite in src/indicator/cat.ts, shown at 2× with hard pixel
         edges (no smoothing). Keep in step with WIDTH/HEIGHT in shell/indicator.rs;
         the script sizes the canvas itself, so only the display size lives here. */
      #cat {
        width: 192px;
        height: 176px;
        image-rendering: pixelated;
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="cat"></canvas>
    <script type="module" src="/src/indicator/indicator.ts"></script>
  </body>
</html>
